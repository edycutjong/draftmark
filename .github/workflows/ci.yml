name: CI
# 6-stage pipeline. Stages 1 and 2 run in parallel; Build -> E2E + Performance; the Deploy Gate passes only when
# every stage passed (main only). The Deploy workflow (release + Vercel) runs after this one succeeds.
#
#   Stage 1 Quality (frontend matrix + backend) ─┐
#                                                ├─> Stage 3 Build ─> Stage 4 E2E ─────────┐
#   Stage 2 Security (secrets + dependencies) ───┘                 └─> Stage 5 Performance ─┴─> Stage 6 Deploy Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # ── STAGE 1: Code Quality ────────────────────────────────
  frontend-quality:
    name: "Stage 1 · Frontend Quality (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck

  backend-quality:
    name: "Stage 1 · Backend Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.2
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit + API tests with a 100% coverage gate (pytest-cov)
        run: python -m pytest -q --cov=api --cov-report=term-missing --cov-fail-under=100

  # ── STAGE 2: Security Gate ───────────────────────────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production, high + critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (deployed Python deps)
        run: pip install pip-audit && pip-audit -r requirements.txt

  # ── STAGE 3: Build Verification ──────────────────────────
  build:
    name: "Stage 3 · Build Verification"
    needs: [frontend-quality, backend-quality, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next.js production build
        run: npm run build
      - name: Bundle size budget
        run: |
          KB=$(du -sk .next/static | cut -f1)
          echo "Static assets: ${KB} KB"
          if [ "$KB" -gt 2000 ]; then echo "::error::${KB} KB exceeds the 2000 KB budget"; exit 1; fi
          if [ "$KB" -gt 1500 ]; then echo "::warning::${KB} KB exceeds the 1500 KB warning line"; fi
      - name: Landing + deck numbers are sourced
        run: python3 scripts/check_landing.py
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/version.json
          include-hidden-files: true
          retention-days: 1

  # ── STAGE 4: E2E Tests ───────────────────────────────────
  e2e:
    name: "Stage 4 · E2E Tests (Playwright)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5: Performance ─────────────────────────────────
  performance:
    name: "Stage 5 · Performance (Lighthouse CI)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Lighthouse CI (/ and /runs)
        run: npx --yes @lhci/cli@0.14.x autorun

  # ── STAGE 6: Deploy Gate ─────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [build, e2e, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "All stages passed: quality (Node 20/22/24 + Python), secrets, dependencies, build, E2E, Lighthouse."
          echo "The Deploy workflow now cuts the semantic-version release and deploys production."
