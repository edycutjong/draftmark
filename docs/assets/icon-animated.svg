<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DraftMark — time-averages the waterline: The sea keeps moving across the 12M mark; one thin line stops, holds, and is written down.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the static mark — plate, painted 8, sea at rest, amber line held (poster rule: all visible)
  10-20%  trigger:      the sea starts moving with real swell (24 frames of clip dB7X); the line loosens into a wide band   data-story="beat-2"
  20-70%  mechanism:    The sea keeps moving across the 12M mark; one thin line stops, holds, and is written down.   data-story="beat-3"
  70-86%  resolution:   the band collapses onto the held line; the line glows once (written down)   data-story="beat-4"
  86-100% breathe + seam: the sea returns to rest, the glow fades; frame 100% = frame 0
-->
  <style>
    [data-story] { transform-box: fill-box; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
